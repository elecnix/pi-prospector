name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One CI run per pull request. Pushing again supersedes the previous run
# instead of queueing beside it: the self-hosted pool is a fixed number of
# runner slots, and a superseded run holds one for as long as a live one does.
# Pushes to main are never cancelled -- main's history has to stay verified.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: arc-runners
    # The suite takes 1-3 minutes. A test file that leaks a handle never exits
    # -- node's --test-timeout does not cover it, because the subtests all
    # finish and it is the process that will not drain -- so without a job
    # timeout the runner is held for the GitHub default of six hours. Three
    # such jobs is the repo's entire runner allocation.
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --legacy-peer-deps
      - run: npm test

  integration-test:
    needs: test
    runs-on: arc-runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: node --import tsx test/integration/test-commands.ts

  dupdelta:
    # Reports only the duplication this pull request introduces, as inline
    # warnings on the diff. Never fails the build.
    if: github.event_name == 'pull_request'
    runs-on: arc-runners
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the merge-base has to be reachable
      - uses: elecnix/dupdelta@v0.2.0

  pr-body-format:
    # Flags a PR description that renders badly on GitHub: hard-wrapped
    # paragraphs, broken list items, collapsed tables, unparsable mermaid.
    if: github.event_name == 'pull_request'
    runs-on: arc-runners
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - name: Install GitHub CLI (the action's checkers shell out to gh)
        run: |
          GH_VERSION=2.98.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
      - uses: elecnix/gh-pr-body-action@v1