name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: arc-runners
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --legacy-peer-deps
      - run: npm test

  integration-test:
    needs: test
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: node --import tsx test/integration/test-commands.ts

  dupdelta:
    # Reports only the duplication this pull request introduces, as inline
    # warnings on the diff. Never fails the build.
    if: github.event_name == 'pull_request'
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the merge-base has to be reachable
      - uses: elecnix/dupdelta@v0.1.0
        with:
          # actions/checkout with fetch-depth: 0 leaves HEAD detached, so the
          # action's default `main` does not resolve; the remote-tracking ref
          # from the full fetch does.
          base: origin/main