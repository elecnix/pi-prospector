name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Review this pull request with Cite
        # Pinned to a full commit SHA, like everything else a repository
        # ruleset checks -- including the actions a composite action calls.
        # v0.11.3 moved Cite's own upload-artifact off the Node 20 action
        # GitHub is retiring; v0.11.4 resolves the pull request from the
        # event payload, which a pull_request_target trigger needs.
        uses: elecnix/cite@f5707676437aacf2d3566d0e831c5c558717f994 # v0.15.0
        with:
          model_api_key: ${{ secrets.OLLAMA_API_KEY }}
          model_base_url: https://ollama.com/v1
          model_id: deepseek-v4.1-flash
          structured_output: tools
